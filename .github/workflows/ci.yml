# Markdown + plugin.json 司令室向け。フルアプリ CI は置かない。
# 検査は scripts/ci.py と同じ（相対リンク、knowhow 出典、plugin.json）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo checks
        run: python3 scripts/ci.py
